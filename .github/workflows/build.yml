name: Build JoolinkSDReplay dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib (xcrun clang)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          set -o pipefail
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=13.0 \
            -isysroot "$SDK" \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework ImageIO \
            Tweak.m -o JoolinkSDReplay-v4.14.4.dylib 2>&1 | tee build.log
          ls -la JoolinkSDReplay-v4.14.4.dylib 2>/dev/null || true
          exit ${PIPESTATUS[0]}

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v4.14.4
          path: build.log

      - name: Annotate compile errors
        if: always()
        run: |
          if [ -f build.log ]; then
            grep "error:" build.log | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload dylib artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JoolinkSDReplay-v4.14.4
          path: JoolinkSDReplay-v4.14.4.dylib
