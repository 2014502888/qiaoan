name: Build JoolinkSDReplay dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib (xcrun clang)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=13.0 \
            -isysroot "$SDK" \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            Tweak.m -o JoolinkSDReplay-v2.3.dylib
          ls -la JoolinkSDReplay-v2.3.dylib
          file JoolinkSDReplay-v2.3.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoolinkSDReplay-v2.3
          path: JoolinkSDReplay-v2.3.dylib
